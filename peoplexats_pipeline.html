<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleX ATS — Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#fe572a;--od:rgba(254,87,42,0.12);--og:rgba(254,87,42,0.3);
  --g:#8cc74f;--gd:rgba(140,199,79,0.1);
  --ink:#080706;--ink2:#111009;--ink3:#1a1814;--ink4:#211f1c;
  --w:#fff;--mu:rgba(255,255,255,0.42);--mu2:rgba(255,255,255,0.18);
  --bd:rgba(255,255,255,0.06);--bd2:rgba(255,255,255,0.1);
  --err:#f87171;--errd:rgba(248,113,113,0.1);
  --f:system-ui,-apple-system,sans-serif;
  --ez:cubic-bezier(0.16,1,0.3,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--ink);color:var(--w);-webkit-font-smoothing:antialiased;display:flex}

#loading{position:fixed;inset:0;z-index:999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.big-spin{width:36px;height:36px;border:3px solid rgba(254,87,42,.3);border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--mu)}

/* SIDEBAR */
#sidebar{width:220px;flex-shrink:0;background:var(--ink2);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;text-decoration:none}
.sb-ws{padding:12px 14px;margin:10px 10px 4px;background:var(--ink3);border-radius:8px;border:1px solid var(--bd2)}
.sb-ws-name{font-size:12px;font-weight:700;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ws-role{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.sb-section{padding:6px 10px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu2)}
.sb-nav{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.sb-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--mu);text-decoration:none;transition:all .15s;position:relative}
.sb-link:hover{background:var(--ink3);color:var(--w)}
.sb-link.active{background:var(--od);color:var(--o);font-weight:600}
.sb-link.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--o);border-radius:0 2px 2px 0}
.sb-link svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.sb-link.active svg{opacity:1}
.sb-badge{margin-left:auto;background:var(--o);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;line-height:1.5}
.sb-bottom{margin-top:auto;padding:12px 10px;border-top:1px solid var(--bd)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s}
.sb-user:hover{background:var(--ink3)}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:var(--od);border:1px solid rgba(254,87,42,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--o);flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-uemail{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:56px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:12px}
.tb-title{font-size:15px;font-weight:700;color:var(--w)}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{font-family:var(--f);font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 14px;transition:all .15s;text-decoration:none}
.tb-btn-sec{background:var(--ink3);color:var(--mu);border:1px solid var(--bd2)}
.tb-btn-sec:hover{color:var(--w);border-color:rgba(255,255,255,.2)}

/* FILTER BAR */
.filter-bar{padding:10px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.filter-select{background:var(--ink3);border:1px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:12px;padding:5px 10px;border-radius:6px;outline:none;cursor:pointer}
.filter-select:focus{border-color:var(--o)}
.filter-select option{background:var(--ink3)}
.filter-search{background:var(--ink3);border:1px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:12px;padding:5px 12px;border-radius:6px;outline:none;min-width:200px}
.filter-search::placeholder{color:var(--mu2)}
.filter-search:focus{border-color:var(--o)}
.filter-count{font-size:12px;color:var(--mu);margin-left:auto}

/* KANBAN BOARD */
#board{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;padding:16px 20px;gap:12px}
.stage-col{flex-shrink:0;width:260px;display:flex;flex-direction:column;gap:0}
.stage-head{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;border-radius:9px 9px 0 0;background:var(--ink3);border:1px solid var(--bd2);border-bottom:none}
.stage-label{font-size:12px;font-weight:700;color:var(--w);display:flex;align-items:center;gap:7px}
.stage-dot{width:7px;height:7px;border-radius:50%}
.stage-n{font-size:11px;color:var(--mu);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:10px;font-weight:600}
.stage-cards{flex:1;overflow-y:auto;background:rgba(255,255,255,.015);border:1px solid var(--bd2);border-top:none;border-radius:0 0 9px 9px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.stage-cards.drag-over{background:var(--od);border-color:rgba(254,87,42,.3)}

/* CANDIDATE CARD */
.cand-card{background:var(--ink2);border:1px solid var(--bd);border-radius:9px;padding:14px;cursor:pointer;transition:all .15s;user-select:none}
.cand-card:hover{border-color:var(--bd2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.cand-card.dragging{opacity:.4;transform:rotate(2deg)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.card-name{font-size:13px;font-weight:700;color:var(--w);line-height:1.3}
.card-job{font-size:11px;color:var(--mu);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-score{flex-shrink:0}
.score-ring{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid}
.score-ring.high{color:var(--g);border-color:rgba(140,199,79,.4);background:var(--gd)}
.score-ring.mid{color:#fbbf24;border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.score-ring.low{color:var(--err);border-color:rgba(248,113,113,.4);background:var(--errd)}
.score-ring.none{color:var(--mu2);border-color:var(--bd2);background:transparent;font-size:9px}
.card-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card-tag{font-size:10px;color:var(--mu);display:flex;align-items:center;gap:3px}
.card-foot{display:flex;align-items:center;justify-content:space-between}
.card-source{font-size:10px;color:var(--mu2);text-transform:capitalize}
.card-age{font-size:10px;color:var(--mu2)}
.card-actions{display:flex;gap:4px}
.card-act-btn{background:none;border:none;font-size:11px;cursor:pointer;padding:3px 7px;border-radius:4px;color:var(--mu);transition:all .15s;font-family:var(--f)}
.card-act-btn:hover{background:var(--ink3);color:var(--w)}
.card-act-btn.reject{color:rgba(248,113,113,.6)}
.card-act-btn.reject:hover{color:var(--err);background:var(--errd)}

/* DETAIL DRAWER */
#drawer{position:fixed;top:0;right:0;width:480px;height:100vh;background:var(--ink2);border-left:1px solid var(--bd2);z-index:300;transform:translateX(100%);transition:transform .3s var(--ez);display:flex;flex-direction:column;overflow:hidden}
#drawer.open{transform:translateX(0)}
.dr-head{padding:20px 24px;border-bottom:1px solid var(--bd);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.dr-close{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:4px;border-radius:4px;transition:color .15s;line-height:1;flex-shrink:0}
.dr-close:hover{color:var(--w)}
.dr-name{font-size:18px;font-weight:800;color:var(--w);letter-spacing:-.01em}
.dr-job{font-size:13px;color:var(--mu);margin-top:3px}
.dr-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:20px}
.dr-section{display:flex;flex-direction:column;gap:8px}
.dr-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu2)}
.dr-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dr-info-item{background:var(--ink3);border-radius:7px;padding:10px 12px}
.dr-info-label{font-size:10px;color:var(--mu);margin-bottom:3px}
.dr-info-val{font-size:13px;font-weight:600;color:var(--w)}
.ai-score-bar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:4px}
.ai-score-fill{height:100%;border-radius:3px;transition:width .6s var(--ez)}
.ai-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:5px;font-weight:600}
.ai-tag.strength{color:var(--g);background:var(--gd);border:1px solid rgba(140,199,79,.2)}
.ai-tag.gap{color:var(--err);background:var(--errd);border:1px solid rgba(248,113,113,.2)}
.ai-tags{display:flex;flex-wrap:wrap;gap:6px}
.dr-summary{font-size:13px;color:rgba(255,255,255,.7);line-height:1.7;background:var(--ink3);border-radius:8px;padding:14px}
.dr-stage-select{background:var(--ink3);border:1.5px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:13px;padding:9px 12px;border-radius:8px;outline:none;width:100%;cursor:pointer;transition:border-color .2s}
.dr-stage-select:focus{border-color:var(--o)}
.dr-stage-select option{background:var(--ink3)}
.dr-cv-btn{display:flex;align-items:center;gap:8px;background:var(--ink3);border:1px solid var(--bd2);border-radius:8px;padding:10px 14px;color:var(--w);font-size:13px;font-weight:600;text-decoration:none;transition:all .15s;cursor:pointer}
.dr-cv-btn:hover{border-color:rgba(255,255,255,.2);background:var(--ink4)}
.dr-answers{display:flex;flex-direction:column;gap:10px}
.dr-answer{background:var(--ink3);border-radius:7px;padding:12px}
.dr-answer-q{font-size:11px;color:var(--mu);margin-bottom:4px}
.dr-answer-a{font-size:13px;color:var(--w);line-height:1.5}
.comment-form{display:flex;gap:8px;flex-shrink:0}
.comment-input{flex:1;background:var(--ink3);border:1.5px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:13px;padding:8px 12px;border-radius:8px;outline:none;resize:none;min-height:40px;transition:border-color .2s;line-height:1.5}
.comment-input::placeholder{color:var(--mu2)}
.comment-input:focus{border-color:var(--o)}
.comment-submit{background:var(--o);border:none;color:#fff;font-family:var(--f);font-size:12px;font-weight:700;padding:8px 14px;border-radius:7px;cursor:pointer;align-self:flex-end;transition:background .15s;white-space:nowrap}
.comment-submit:hover{background:#ff6a40}
.comment-submit:disabled{opacity:.5;cursor:not-allowed}
.comment-list{display:flex;flex-direction:column;gap:10px}
.comment-item{background:var(--ink3);border-radius:8px;padding:12px}
.comment-meta{font-size:11px;color:var(--mu);margin-bottom:5px}
.comment-body{font-size:13px;color:rgba(255,255,255,.8);line-height:1.6}
.dr-actions{display:flex;gap:8px;padding:16px 24px;border-top:1px solid var(--bd);flex-shrink:0}
.dr-act{flex:1;font-family:var(--f);font-size:12px;font-weight:600;border:none;border-radius:7px;padding:9px;cursor:pointer;transition:all .15s}
.dr-hire{background:var(--gd);color:var(--g);border:1px solid rgba(140,199,79,.2)}
.dr-hire:hover{background:rgba(140,199,79,.2)}
.dr-reject{background:var(--errd);color:var(--err);border:1px solid rgba(248,113,113,.2)}
.dr-reject:hover{background:rgba(248,113,113,.2)}

/* EMPTY STAGE */
.stage-empty{padding:16px;text-align:center;font-size:12px;color:var(--mu2);line-height:1.6}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--ink2);border:1px solid var(--bd2);border-radius:9px;padding:12px 16px;font-size:13px;color:var(--w);box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideUp .3s var(--ez);display:flex;align-items:center;gap:8px;max-width:320px}
.toast-item.ok{border-left:3px solid var(--g)}
.toast-item.er{border-left:3px solid var(--err)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

@media(max-width:900px){
  #sidebar{width:60px}
  .sb-logo svg:last-child,.sb-ws,.sb-section,.sb-link span,.sb-badge,.sb-uname,.sb-uemail{display:none}
  .sb-link{justify-content:center;padding:10px}
  .sb-logo{justify-content:center;padding:16px}
  .sb-nav{padding:4px 6px}
  .sb-bottom{padding:8px 6px}
  .sb-user{justify-content:center}
  #drawer{width:100vw}
}
</style>
</head>

<script>
const SB = supabase.createClient(
  'https://fdkvbszbgjhkvybawxrf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZka3Zic3piZ2poa3Z5YmF3eHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDM1NDUsImV4cCI6MjA4OTcxOTU0NX0.lc3QW3urgxJw1ucjkR4Buxw8OI034SI6vE1UoxOgYqM'
);

const STAGES = [
  {key:'new',label:'New',color:'#6b7280'},
  {key:'screening',label:'Screening',color:'#f59e0b'},
  {key:'shortlisted',label:'Shortlisted',color:'#3b82f6'},
  {key:'interview',label:'Interview',color:'#8b5cf6'},
  {key:'offer',label:'Offer',color:'#fe572a'},
  {key:'hired',label:'Hired',color:'#8cc74f'},
];

let WS=null, MEMBER=null, allCandidates=[], allJobs=[], openCandId=null, dragCandId=null;

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { window.location.href = 'peoplexats_auth.html'; return; }

  const { data: member } = await SB.from('team_members').select('*,workspaces(*)').eq('user_id', session.user.id).eq('status','active').single();
  if (!member) { window.location.href = 'peoplexats_onboarding.html'; return; }
  MEMBER = member; WS = member.workspaces;

  document.getElementById('ws-name').textContent = WS.name;
  document.getElementById('ws-role').textContent = member.role;
  const name = member.full_name || session.user.email;
  document.getElementById('sb-uname').textContent = name;
  document.getElementById('sb-uemail').textContent = member.email || session.user.email;
  document.getElementById('sb-avatar').textContent = name.charAt(0).toUpperCase();

  await loadAll();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = 'flex';

  // Check URL param for pre-selected job
  const params = new URLSearchParams(location.search);
  const jobParam = params.get('job');
  if (jobParam) { document.getElementById('job-filter').value = jobParam; applyFilters(); }
  const candParam = params.get('id');
  if (candParam) { const c = allCandidates.find(x=>x.id===candParam); if(c) openDrawer(c); }
}

async function loadAll() {
  const [candsRes, jobsRes] = await Promise.all([
    SB.from('candidates').select('*,jobs(title,screening_questions)').eq('workspace_id',WS.id).order('ai_score',{ascending:false,nullsFirst:false}),
    SB.from('jobs').select('id,title').eq('workspace_id',WS.id).order('created_at',{ascending:false})
  ]);
  allCandidates = candsRes.data || [];
  allJobs = jobsRes.data || [];
  document.getElementById('badge-cands').textContent = allCandidates.length;

  // Populate job filter
  const jf = document.getElementById('job-filter');
  const currentVal = jf.value;
  jf.innerHTML = '<option value="">All Jobs</option>' + allJobs.map(j=>`<option value="${j.id}">${escHtml(j.title)}</option>`).join('');
  if (currentVal) jf.value = currentVal;

  applyFilters();
}

function applyFilters() {
  const jobF = document.getElementById('job-filter').value;
  const srcF = document.getElementById('source-filter').value;
  const q = document.getElementById('search-filter').value.toLowerCase();
  let cands = allCandidates;
  if (jobF) cands = cands.filter(c=>c.job_id===jobF);
  if (srcF) cands = cands.filter(c=>c.source===srcF);
  if (q) cands = cands.filter(c=>c.full_name.toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q)||(c.city||'').toLowerCase().includes(q));
  document.getElementById('filter-count').textContent = `${cands.length} candidate${cands.length!==1?'s':''}`;
  renderBoard(cands);
}

// ── BOARD ─────────────────────────────────────────────────────────────────────
function renderBoard(cands) {
  const board = document.getElementById('board');
  const byStage = {};
  STAGES.forEach(s=>byStage[s.key]=[]);
  cands.forEach(c=>{byStage[c.status]?.push(c);});

  board.innerHTML = STAGES.map(s => {
    const cards = byStage[s.key]||[];
    return `
    <div class="stage-col">
      <div class="stage-head">
        <div class="stage-label"><div class="stage-dot" style="background:${s.color}"></div>${s.label}</div>
        <span class="stage-n">${cards.length}</span>
      </div>
      <div class="stage-cards" data-stage="${s.key}"
           ondragover="onDragOver(event)"
           ondragleave="onDragLeave(event)"
           ondrop="onDrop(event,'${s.key}')">
        ${cards.length===0?`<div class="stage-empty">Drop candidates here</div>`:''}
        ${cards.map(c=>renderCard(c)).join('')}
      </div>
    </div>`;
  }).join('');
}

function renderCard(c) {
  const score = c.ai_score;
  const scoreClass = score==null?'none':score>=70?'high':score>=45?'mid':'low';
  const scoreText = score!=null?Math.round(score):'AI';
  const ago = (ts)=>{const d=Math.floor((Date.now()-new Date(ts))/86400000);return d===0?'Today':d===1?'Yesterday':`${d}d ago`;};
  const job = c.jobs?.title||'—';
  return `
  <div class="cand-card" draggable="true"
       ondragstart="onDragStart(event,'${c.id}')"
       ondragend="onDragEnd(event)"
       onclick="openDrawer(getCand('${c.id}'))">
    <div class="card-top">
      <div>
        <div class="card-name">${escHtml(c.full_name)}</div>
        <div class="card-job">${escHtml(job)}</div>
      </div>
      <div class="card-score">
        <div class="score-ring ${scoreClass}">${scoreText}</div>
      </div>
    </div>
    <div class="card-meta">
      ${c.city?`<span class="card-tag">📍${escHtml(c.city)}</span>`:''}
      ${c.nysc_status&&c.nysc_status!=='not_applicable'?`<span class="card-tag">🎓${c.nysc_status}</span>`:''}
    </div>
    <div class="card-foot">
      <span class="card-source">${(c.source||'').replace('_',' ')}</span>
      <span class="card-age">${ago(c.created_at)}</span>
    </div>
  </div>`;
}

function getCand(id) { return allCandidates.find(c=>c.id===id); }

// ── DRAG & DROP ────────────────────────────────────────────────────────────────
function onDragStart(e, id) {
  dragCandId = id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function onDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
async function onDrop(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (!dragCandId) return;
  const cand = getCand(dragCandId);
  if (!cand || cand.status === stage) { dragCandId=null; return; }
  await moveCandidate(dragCandId, stage);
  dragCandId = null;
}

async function moveCandidate(id, stage) {
  const { error } = await SB.from('candidates').update({status:stage,status_updated_at:new Date().toISOString()}).eq('id',id).eq('workspace_id',WS.id);
  if (error) { toast(error.message,'er'); return; }
  const cand = getCand(id);
  if (cand) cand.status = stage;
  applyFilters();
  if (openCandId === id) {
    document.getElementById('dr-stage').value = stage;
  }
  toast(`Moved to ${stage}`,'ok');
}

// ── DRAWER ─────────────────────────────────────────────────────────────────────
async function openDrawer(c) {
  if (!c) return;
  openCandId = c.id;
  document.getElementById('dr-name').textContent = c.full_name;
  document.getElementById('dr-job').textContent = c.jobs?.title || '—';

  // Load comments
  const { data: comments } = await SB.from('candidate_comments')
    .select('*,team_members(full_name)')
    .eq('candidate_id',c.id)
    .order('created_at',{ascending:true});

  const score = c.ai_score;
  const scoreClass = score==null?'none':score>=70?'high':score>=45?'mid':'low';
  const barColor = score==null?'var(--mu2)':score>=70?'var(--g)':score>=45?'#fbbf24':'var(--err)';
  const strengths = Array.isArray(c.ai_strengths)?c.ai_strengths:[];
  const gaps = Array.isArray(c.ai_gaps)?c.ai_gaps:[];
  const answers = c.screening_answers && typeof c.screening_answers==='object' ? Object.entries(c.screening_answers) : [];
  const questions = c.jobs?.screening_questions||[];

  document.getElementById('dr-body').innerHTML = `
    <!-- STAGE MOVER -->
    <div class="dr-section">
      <div class="dr-section-title">Pipeline Stage</div>
      <select class="dr-stage-select" id="dr-stage" onchange="moveCandidate('${c.id}',this.value)">
        ${STAGES.map(s=>`<option value="${s.key}" ${c.status===s.key?'selected':''}>${s.label}</option>`).join('')}
      </select>
    </div>

    <!-- CONTACT -->
    <div class="dr-section">
      <div class="dr-section-title">Contact</div>
      <div class="dr-info-grid">
        <div class="dr-info-item"><div class="dr-info-label">Email</div><div class="dr-info-val">${escHtml(c.email)}</div></div>
        <div class="dr-info-item"><div class="dr-info-label">Phone</div><div class="dr-info-val">${escHtml(c.phone||'—')}</div></div>
        <div class="dr-info-item"><div class="dr-info-label">City</div><div class="dr-info-val">${escHtml(c.city||'—')}</div></div>
        <div class="dr-info-item"><div class="dr-info-label">NYSC</div><div class="dr-info-val" style="text-transform:capitalize">${(c.nysc_status||'—').replace('_',' ')}</div></div>
      </div>
    </div>

    <!-- CV -->
    ${c.cv_url?`<div class="dr-section">
      <div class="dr-section-title">CV / Resume</div>
      <a href="${c.cv_url}" target="_blank" class="dr-cv-btn">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2h7l3 3v7a1 1 0 01-1 1H2a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="currentColor" stroke-width="1.2" fill="none"/><path d="M9 2v3h3M4 7h6M4 9.5h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        ${escHtml(c.cv_filename||'Download CV')}
      </a>
    </div>`:''}

    <!-- AI ASSESSMENT -->
    <div class="dr-section">
      <div class="dr-section-title">AI Assessment</div>
      ${score!=null?`
      <div style="background:var(--ink3);border-radius:8px;padding:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:12px;color:var(--mu)">Match Score</span>
          <span style="font-size:20px;font-weight:800;color:${barColor}">${Math.round(score)}<span style="font-size:12px;font-weight:400">/100</span></span>
        </div>
        <div class="ai-score-bar"><div class="ai-score-fill" style="width:${score}%;background:${barColor}"></div></div>
      </div>`:'<div style="font-size:13px;color:var(--mu);padding:12px;background:var(--ink3);border-radius:8px">AI scoring pending — score appears after the candidate applies.</div>'}
      ${c.ai_summary?`<div class="dr-summary">${escHtml(c.ai_summary)}</div>`:''}
      ${strengths.length?`<div><div style="font-size:11px;color:var(--mu2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em">Strengths</div><div class="ai-tags">${strengths.map(s=>`<span class="ai-tag strength">✓ ${escHtml(s)}</span>`).join('')}</div></div>`:''}
      ${gaps.length?`<div><div style="font-size:11px;color:var(--mu2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em">Gaps</div><div class="ai-tags">${gaps.map(g=>`<span class="ai-tag gap">✗ ${escHtml(g)}</span>`).join('')}</div></div>`:''}
    </div>

    <!-- SCREENING ANSWERS -->
    ${answers.length||questions.length?`<div class="dr-section">
      <div class="dr-section-title">Screening Answers</div>
      <div class="dr-answers">
        ${questions.map((q,i)=>{const a=c.screening_answers?.[i]||c.screening_answers?.[q]||'—';return `<div class="dr-answer"><div class="dr-answer-q">${escHtml(q)}</div><div class="dr-answer-a">${escHtml(String(a))}</div></div>`;}).join('')}
      </div>
    </div>`:''}

    <!-- COMMENTS -->
    <div class="dr-section">
      <div class="dr-section-title">Team Notes</div>
      <div class="comment-form">
        <textarea class="comment-input" id="comment-text" placeholder="Add a note…" rows="2" onkeydown="if(event.key==='Enter'&&event.metaKey)submitComment('${c.id}')"></textarea>
        <button class="comment-submit" onclick="submitComment('${c.id}')">Post</button>
      </div>
      <div class="comment-list" id="comment-list">
        ${(comments||[]).map(cm=>`
          <div class="comment-item">
            <div class="comment-meta">${escHtml(cm.team_members?.full_name||'Team')} · ${new Date(cm.created_at).toLocaleDateString('en-NG',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
            <div class="comment-body">${escHtml(cm.body)}</div>
          </div>`).join('')}
        ${(!comments||comments.length===0)?'<div style="font-size:12px;color:var(--mu2);text-align:center;padding:8px">No notes yet</div>':''}
      </div>
    </div>
  `;

  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  openCandId = null;
}

async function submitComment(candId) {
  const text = document.getElementById('comment-text').value.trim();
  if (!text) return;
  const btn = document.querySelector('.comment-submit');
  btn.disabled = true;
  const { data, error } = await SB.from('candidate_comments').insert({
    candidate_id: candId,
    workspace_id: WS.id,
    author_id: MEMBER.id,
    body: text,
  }).select('*,team_members(full_name)').single();
  btn.disabled = false;
  if (error) { toast(error.message,'er'); return; }
  document.getElementById('comment-text').value = '';
  const list = document.getElementById('comment-list');
  const noNotes = list.querySelector('[style*="No notes"]');
  if (noNotes) noNotes.remove();
  const item = document.createElement('div');
  item.className = 'comment-item';
  item.innerHTML = `<div class="comment-meta">${escHtml(data.team_members?.full_name||'You')} · Just now</div><div class="comment-body">${escHtml(text)}</div>`;
  list.appendChild(item);
  toast('Note added','ok');
}

async function markHired() {
  if (!openCandId) return;
  if (!confirm('Mark this candidate as hired? This will redirect you to the Hires page to record the hire details.')) return;
  await moveCandidate(openCandId, 'hired');
  closeDrawer();
  window.location.href = `peoplexats_hires.html?candidate=${openCandId}`;
}

async function markRejected() {
  if (!openCandId) return;
  if (!confirm('Reject this candidate? They will be moved to the Rejected stage.')) return;
  await moveCandidate(openCandId, 'rejected');
  closeDrawer();
}

async function signOut() { await SB.auth.signOut(); window.location.href = 'peoplexats_auth.html'; }
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type='ok'){const el=document.createElement('div');el.className=`toast-item ${type}`;el.innerHTML=`<span>${type==='ok'?'✓':'✕'}</span>${escHtml(msg)}`;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),3500);}

init();
</script>
</body>
</html>

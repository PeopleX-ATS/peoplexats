<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleX ATS — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#fe572a;--od:rgba(254,87,42,0.13);--og:rgba(254,87,42,0.35);
  --g:#8cc74f;--gd:rgba(140,199,79,0.12);
  --ink:#080706;--ink2:#111009;--ink3:#1a1814;
  --w:#fff;--mu:rgba(255,255,255,0.42);
  --bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.12);
  --err:#f87171;--errd:rgba(248,113,113,0.12);
  --ez:cubic-bezier(0.16,1,0.3,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,sans-serif;background:var(--ink);color:var(--w);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}

body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
body::after{content:'';position:fixed;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(254,87,42,0.1) 0%,transparent 70%);bottom:-200px;left:-200px;pointer-events:none;z-index:0}

/* Loading */
#loading{position:fixed;inset:0;z-index:999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.big-spinner{width:36px;height:36px;border:3px solid rgba(254,87,42,.3);border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite}
#loading p{font-size:13px;color:var(--mu)}
@keyframes spin{to{transform:rotate(360deg)}}

/* Card */
#app{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}
.card{background:var(--ink2);border:1px solid var(--bd2);border-radius:20px;padding:36px 32px;animation:fadeUp .4s var(--ez)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.logo-mark{width:34px;height:34px;background:var(--o);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff}
.logo-text{font-size:19px;font-weight:800;letter-spacing:-.02em}

/* Tabs */
.tabs{display:flex;background:var(--ink3);border-radius:8px;padding:3px;margin-bottom:28px}
.tab{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;border-radius:6px;transition:all .2s}
.tab.active{background:var(--ink2);color:var(--w);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* Fields */
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:7px}
.field input{width:100%;background:var(--ink3);border:1.5px solid var(--bd2);color:var(--w);font-family:system-ui,sans-serif;font-size:14px;padding:11px 14px;border-radius:9px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder{color:rgba(255,255,255,.2)}
.field input:focus{border-color:var(--o);box-shadow:0 0 0 3px var(--od)}

/* Error */
.err-box{background:var(--errd);border:1px solid rgba(248,113,113,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--err);margin-bottom:14px;display:none}
/* Success */
.ok-box{background:var(--gd);border:1px solid rgba(140,199,79,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--g);margin-bottom:14px;display:none}

/* Buttons */
.btn{width:100%;font-family:system-ui,sans-serif;font-size:13px;font-weight:700;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;padding:12px}
.btn-primary{background:var(--o);color:#fff;box-shadow:0 2px 12px rgba(254,87,42,.3);margin-top:4px}
.btn-primary:hover:not(:disabled){background:#ff6a40;transform:translateY(-1px)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}

/* Links */
.link{font-size:12px;color:var(--mu);text-align:center;margin-top:16px}
.link a{color:var(--o);text-decoration:none;font-weight:600}
.link a:hover{text-decoration:underline}

/* Divider */
.divider{height:1px;background:var(--bd);margin:20px 0;position:relative}
.divider::after{content:'or';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink2);padding:0 10px;font-size:11px;color:var(--mu);font-weight:600}

/* Password strength */
.strength-bar{height:3px;border-radius:2px;background:var(--bd2);margin-top:6px;overflow:hidden}
.strength-fill{height:100%;border-radius:2px;transition:width .3s,background .3s}
.strength-label{font-size:11px;color:var(--mu);margin-top:4px}

/* Terms */
.terms{font-size:11px;color:var(--mu);text-align:center;margin-top:14px;line-height:1.6}
.terms a{color:var(--o);text-decoration:none}
</style>
</head>
<body>

<div id="loading">
  <div class="big-spinner"></div>
  <p>Loading PeopleX…</p>
</div>

<div id="app" style="display:none">
  <div class="card">
    <div class="logo">
      <div class="logo-mark">P</div>
      <span class="logo-text">PeopleX</span>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" id="tab-signin" onclick="switchTab('signin')">Sign In</div>
      <div class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</div>
    </div>

    <!-- Error / success banners -->
    <div class="err-box" id="err-box"></div>
    <div class="ok-box" id="ok-box"></div>

    <!-- SIGN IN FORM -->
    <div id="form-signin">
      <div class="field">
        <label>Email</label>
        <input type="email" id="si-email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="si-password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')signIn()">
      </div>
      <button class="btn btn-primary" id="si-btn" onclick="signIn()">
        <span id="si-label">Sign In</span>
        <span class="spinner" id="si-spinner" style="display:none"></span>
      </button>
      <div class="link"><a href="peoplexats_reset.html">Forgot password?</a></div>
    </div>

    <!-- SIGN UP FORM -->
    <div id="form-signup" style="display:none">
      <div class="field">
        <label>Email *</label>
        <input type="email" id="su-email" placeholder="you@company.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password *</label>
        <input type="password" id="su-password" placeholder="Min 8 characters" autocomplete="new-password" oninput="checkStrength()">
        <div class="strength-bar"><div class="strength-fill" id="strength-fill" style="width:0%"></div></div>
        <div class="strength-label" id="strength-label"></div>
      </div>
      <div class="field">
        <label>Confirm Password *</label>
        <input type="password" id="su-confirm" placeholder="••••••••" autocomplete="new-password" onkeydown="if(event.key==='Enter')signUp()">
      </div>
      <button class="btn btn-primary" id="su-btn" onclick="signUp()">
        <span id="su-label">Create Account</span>
        <span class="spinner" id="su-spinner" style="display:none"></span>
      </button>
      <div class="terms">
        By signing up you agree to our
        <a href="peoplexats_terms.html" target="_blank">Terms of Service</a> and
        <a href="peoplexats_privacy.html" target="_blank">Privacy Policy</a>.
      </div>
    </div>

  </div>
</div>

<script>
const sb = supabase.createClient(
  'https://fdkvbszbgjhkvybawxrf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZka3Zic3piZ2poa3Z5YmF3eHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDM1NDUsImV4cCI6MjA4OTcxOTU0NX0.lc3QW3urgxJw1ucjkR4Buxw8OI034SI6vE1UoxOgYqM'
);

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
      await redirectUser(session.user);
      return;
    }
  } catch(e) {}

  // Check for tab param e.g. ?tab=signup
  const params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'signup') switchTab('signup');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// Route user: has workspace → dashboard, no workspace → onboarding
async function redirectUser(user) {
  const { data: member } = await sb.from('team_members')
    .select('id')
    .eq('user_id', user.id)
    .eq('status', 'active')
    .maybeSingle();

  if (member) {
    window.location.href = 'peoplexats_dashboard.html';
  } else {
    window.location.href = 'peoplexats_onboarding.html';
  }
}

// ── TAB SWITCHING ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  clearMessages();
  const isSignin = tab === 'signin';
  document.getElementById('tab-signin').classList.toggle('active', isSignin);
  document.getElementById('tab-signup').classList.toggle('active', !isSignin);
  document.getElementById('form-signin').style.display = isSignin ? 'block' : 'none';
  document.getElementById('form-signup').style.display = isSignin ? 'none' : 'block';
}

// ── MESSAGES ──────────────────────────────────────────────────────────────────
function showErr(msg) {
  const el = document.getElementById('err-box');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('ok-box').style.display = 'none';
}
function showOk(msg) {
  const el = document.getElementById('ok-box');
  el.textContent = msg;
  el.style.display = 'block';
  document.getElementById('err-box').style.display = 'none';
}
function clearMessages() {
  document.getElementById('err-box').style.display = 'none';
  document.getElementById('ok-box').style.display = 'none';
}

// ── PASSWORD STRENGTH ─────────────────────────────────────────────────────────
function checkStrength() {
  const pw = document.getElementById('su-password').value;
  const fill = document.getElementById('strength-fill');
  const label = document.getElementById('strength-label');
  let score = 0;
  if (pw.length >= 8) score++;
  if (pw.length >= 12) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const pct = (score / 5) * 100;
  const colors = ['','#f87171','#f59e0b','#f59e0b','#8cc74f','#8cc74f'];
  const labels = ['','Weak','Fair','Fair','Strong','Strong'];
  fill.style.width = pct + '%';
  fill.style.background = colors[score] || '';
  label.textContent = pw ? labels[score] || '' : '';
  label.style.color = colors[score] || '';
}

// ── SIGN IN ───────────────────────────────────────────────────────────────────
async function signIn() {
  clearMessages();
  const email    = document.getElementById('si-email').value.trim();
  const password = document.getElementById('si-password').value;

  if (!email) return showErr('Please enter your email address.');
  if (!password) return showErr('Please enter your password.');

  const btn = document.getElementById('si-btn');
  const label = document.getElementById('si-label');
  const spinner = document.getElementById('si-spinner');
  btn.disabled = true; label.style.display = 'none'; spinner.style.display = 'inline-block';

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await redirectUser(data.user);
  } catch(e) {
    let msg = e.message || 'Sign in failed. Please try again.';
    if (msg.includes('Invalid login')) msg = 'Incorrect email or password.';
    if (msg.includes('Email not confirmed')) msg = 'Please check your email and confirm your account first.';
    showErr(msg);
  } finally {
    btn.disabled = false; label.style.display = 'inline'; spinner.style.display = 'none';
  }
}

// ── SIGN UP ───────────────────────────────────────────────────────────────────
async function signUp() {
  clearMessages();
  const email    = document.getElementById('su-email').value.trim();
  const password = document.getElementById('su-password').value;
  const confirm  = document.getElementById('su-confirm').value;

  if (!email || !email.includes('@')) return showErr('Please enter a valid email address.');
  if (password.length < 8) return showErr('Password must be at least 8 characters.');
  if (password !== confirm) return showErr('Passwords do not match.');

  const btn = document.getElementById('su-btn');
  const label = document.getElementById('su-label');
  const spinner = document.getElementById('su-spinner');
  btn.disabled = true; label.style.display = 'none'; spinner.style.display = 'inline-block';

  try {
    const { data, error } = await sb.auth.signUp({
      email,
      password,
      options: {
        // After email confirmation, redirect to onboarding
        emailRedirectTo: window.location.origin + '/peoplexats_onboarding.html'
      }
    });

    if (error) throw error;

    // If email confirmation is disabled in Supabase, session is immediate
    if (data.session) {
      window.location.href = 'peoplexats_onboarding.html';
      return;
    }

    // Email confirmation required
    showOk('Account created! Check your email and click the confirmation link to continue.');
    switchTab('signin');

  } catch(e) {
    let msg = e.message || 'Sign up failed. Please try again.';
    if (msg.includes('already registered')) msg = 'An account with this email already exists. Please sign in.';
    showErr(msg);
  } finally {
    btn.disabled = false; label.style.display = 'inline'; spinner.style.display = 'none';
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleX ATS — Jobs</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#fe572a;--od:rgba(254,87,42,0.12);--og:rgba(254,87,42,0.3);
  --g:#8cc74f;--gd:rgba(140,199,79,0.1);
  --ink:#080706;--ink2:#111009;--ink3:#1a1814;--ink4:#211f1c;
  --w:#fff;--mu:rgba(255,255,255,0.42);--mu2:rgba(255,255,255,0.18);
  --bd:rgba(255,255,255,0.06);--bd2:rgba(255,255,255,0.1);
  --err:#f87171;--errd:rgba(248,113,113,0.1);
  --f:system-ui,-apple-system,sans-serif;
  --ez:cubic-bezier(0.16,1,0.3,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--ink);color:var(--w);-webkit-font-smoothing:antialiased;display:flex}

#loading{position:fixed;inset:0;z-index:999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.big-spin{width:36px;height:36px;border:3px solid rgba(254,87,42,.3);border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--mu)}

/* SIDEBAR */
#sidebar{width:220px;flex-shrink:0;background:var(--ink2);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;text-decoration:none}
.sb-ws{padding:12px 14px;margin:10px 10px 4px;background:var(--ink3);border-radius:8px;border:1px solid var(--bd2)}
.sb-ws-name{font-size:12px;font-weight:700;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ws-role{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.sb-section{padding:6px 10px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu2)}
.sb-nav{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.sb-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--mu);text-decoration:none;transition:all .15s;position:relative}
.sb-link:hover{background:var(--ink3);color:var(--w)}
.sb-link.active{background:var(--od);color:var(--o);font-weight:600}
.sb-link.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--o);border-radius:0 2px 2px 0}
.sb-link svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.sb-link.active svg{opacity:1}
.sb-badge{margin-left:auto;background:var(--o);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;line-height:1.5}
.sb-bottom{margin-top:auto;padding:12px 10px;border-top:1px solid var(--bd)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s}
.sb-user:hover{background:var(--ink3)}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:var(--od);border:1px solid rgba(254,87,42,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--o);flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-uemail{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* MAIN */
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:56px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-title{font-size:15px;font-weight:700;color:var(--w)}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{font-family:var(--f);font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 14px;transition:all .15s;text-decoration:none}
.tb-btn-sec{background:var(--ink3);color:var(--mu);border:1px solid var(--bd2)}
.tb-btn-sec:hover{color:var(--w);border-color:rgba(255,255,255,.2)}
.tb-btn-pri{background:var(--o);color:#fff;box-shadow:0 2px 8px var(--og)}
.tb-btn-pri:hover{background:#ff6a40}

/* FILTER BAR */
.filter-bar{padding:14px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0;background:var(--ink)}
.filter-tab{font-family:var(--f);font-size:12px;font-weight:600;background:none;border:1px solid var(--bd2);border-radius:6px;color:var(--mu);padding:5px 14px;cursor:pointer;transition:all .15s}
.filter-tab:hover{color:var(--w);border-color:rgba(255,255,255,.2)}
.filter-tab.active{background:var(--od);border-color:rgba(254,87,42,.3);color:var(--o)}
.filter-search{flex:1;max-width:280px;background:var(--ink3);border:1px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:13px;padding:6px 12px;border-radius:6px;outline:none;margin-left:auto}
.filter-search::placeholder{color:var(--mu2)}
.filter-search:focus{border-color:var(--o)}

/* CONTENT */
#content{flex:1;overflow-y:auto;padding:0}

/* JOB CARDS GRID */
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1px;background:var(--bd);border-top:none}
.job-card{background:var(--ink2);padding:22px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:background .15s;position:relative}
.job-card:hover{background:var(--ink3)}
.job-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.job-card-title{font-size:15px;font-weight:700;color:var(--w);line-height:1.3}
.job-card-menu{position:relative}
.menu-btn{background:none;border:none;color:var(--mu);cursor:pointer;padding:4px 8px;border-radius:5px;font-size:16px;line-height:1;transition:all .15s}
.menu-btn:hover{background:var(--ink4);color:var(--w)}
.dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--ink3);border:1px solid var(--bd2);border-radius:9px;padding:6px;min-width:160px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.dropdown.open{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--mu);cursor:pointer;transition:all .15s;border:none;background:none;font-family:var(--f);width:100%;text-align:left}
.dd-item:hover{background:var(--ink4);color:var(--w)}
.dd-item.danger{color:var(--err)}
.dd-item.danger:hover{background:var(--errd)}
.dd-sep{height:1px;background:var(--bd);margin:4px 0}
.job-card-meta{display:flex;gap:10px;flex-wrap:wrap}
.meta-tag{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:4px}
.job-card-stats{display:flex;gap:16px}
.stat-box{text-align:center}
.stat-box-n{font-size:18px;font-weight:800;color:var(--o);letter-spacing:-.02em}
.stat-box-l{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.job-card-foot{display:flex;align-items:center;justify-content:space-between}
.status-badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px;border-radius:5px}
.status-badge.open{color:var(--g);background:var(--gd);border:1px solid rgba(140,199,79,.2)}
.status-badge.draft{color:var(--mu);background:rgba(255,255,255,.05);border:1px solid var(--bd2)}
.status-badge.closed{color:var(--err);background:var(--errd);border:1px solid rgba(248,113,113,.2)}
.status-badge.paused{color:#fbbf24;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2)}
.card-link{font-size:12px;color:var(--o);text-decoration:none;font-weight:600}
.card-link:hover{text-decoration:underline}
.job-age{font-size:11px;color:var(--mu2)}

/* EMPTY */
.empty-full{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;min-height:320px;text-align:center;gap:12px}
.empty-full .ico{font-size:40px;opacity:.3}
.empty-full h3{font-size:18px;font-weight:700;color:var(--w)}
.empty-full p{font-size:14px;color:var(--mu);max-width:320px;line-height:1.7}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:var(--ink2);border:1px solid var(--bd2);border-radius:16px;width:100%;max-width:580px;animation:slideUp .3s var(--ez);margin:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-head{padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:700;color:var(--w)}
.modal-close{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:4px;border-radius:4px;transition:color .15s;line-height:1}
.modal-close:hover{color:var(--w)}
.modal-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:0}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--ink3);border:1.5px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:13px;padding:10px 12px;border-radius:8px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.2)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px var(--od)}
.field select option{background:var(--ink3)}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sq-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.sq-item{display:flex;gap:8px;align-items:center}
.sq-item input{flex:1}
.sq-rem{background:none;border:none;color:var(--err);cursor:pointer;font-size:15px;padding:4px;opacity:.6;transition:opacity .15s}
.sq-rem:hover{opacity:1}
.add-sq{font-family:var(--f);font-size:12px;color:var(--o);background:none;border:1px dashed rgba(254,87,42,.3);border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:6px;transition:all .15s}
.add-sq:hover{background:var(--od);border-style:solid}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--bd)}
.btn{font-family:var(--f);font-size:13px;font-weight:600;border:none;border-radius:7px;padding:10px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-sec{background:var(--ink3);color:var(--mu);border:1px solid var(--bd2)}
.btn-sec:hover{color:var(--w)}
.btn-pri{background:var(--o);color:#fff}
.btn-pri:hover{background:#ff6a40}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.spin-sm{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--ink2);border:1px solid var(--bd2);border-radius:9px;padding:12px 16px;font-size:13px;color:var(--w);box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideUp .3s var(--ez);display:flex;align-items:center;gap:8px;max-width:320px}
.toast-item.ok{border-left:3px solid var(--g)}
.toast-item.er{border-left:3px solid var(--err)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}

@media(max-width:900px){
  #sidebar{width:60px}
  .sb-logo svg:last-child,.sb-ws,.sb-section,.sb-link span,.sb-badge,.sb-uname,.sb-uemail{display:none}
  .sb-link{justify-content:center;padding:10px}
  .sb-logo{justify-content:center;padding:16px}
  .sb-nav{padding:4px 6px}
  .sb-bottom{padding:8px 6px}
  .sb-user{justify-content:center}
  .jobs-grid{grid-template-columns:1fr}
}
</style>
</head>

<!-- MAIN -->
<div id="main" style="display:none">
  <div class="topbar">
    <div class="tb-left">
      <div class="tb-title">Jobs</div>
      <div id="job-count-label" style="font-size:12px;color:var(--mu)"></div>
    </div>
    <div class="tb-right">
      <a href="#" id="careers-link" target="_blank" class="tb-btn tb-btn-sec">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5H1.5A.75.75 0 00.75 2.25v7.5c0 .414.336.75.75.75h7.5a.75.75 0 00.75-.75V6M8.25.75h3v3M4.5 7.5l5.25-5.25" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        View Careers Page
      </a>
      <button class="tb-btn tb-btn-pri" onclick="openModal()">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1.5v9M1.5 6h9" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
        New Job
      </button>
    </div>
  </div>

  <!-- FILTERS -->
  <div class="filter-bar">
    <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
    <button class="filter-tab" onclick="setFilter('open',this)">Open</button>
    <button class="filter-tab" onclick="setFilter('draft',this)">Draft</button>
    <button class="filter-tab" onclick="setFilter('paused',this)">Paused</button>
    <button class="filter-tab" onclick="setFilter('closed',this)">Closed</button>
    <input class="filter-search" placeholder="Search jobs…" oninput="searchJobs(this.value)" id="search-input">
  </div>

  <div id="content">
    <div id="jobs-grid" class="jobs-grid"></div>
    <div id="empty-state" class="empty-full" style="display:none">
      <div class="ico">💼</div>
      <h3>No jobs yet</h3>
      <p>Post your first job to start receiving applications on your careers page.</p>
      <button class="tb-btn tb-btn-pri" onclick="openModal()" style="margin-top:4px">Post First Job</button>
    </div>
  </div>
</div>

<!-- JOB MODAL -->
<div class="modal-overlay" id="job-modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Post a New Job</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="field"><label>Job Title *</label><input type="text" id="j-title" placeholder="e.g. Senior Frontend Engineer"></div>
      <div class="field-row">
        <div class="field"><label>Department</label><input type="text" id="j-dept" placeholder="Engineering"></div>
        <div class="field"><label>Location</label><input type="text" id="j-loc" placeholder="Lagos, Nigeria"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Job Type</label>
          <select id="j-type">
            <option value="full_time">Full-time</option>
            <option value="part_time">Part-time</option>
            <option value="contract">Contract</option>
            <option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option>
          </select>
        </div>
        <div class="field"><label>Status</label>
          <select id="j-status">
            <option value="open">Open (live now)</option>
            <option value="draft">Draft</option>
            <option value="paused">Paused</option>
            <option value="closed">Closed</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Job Description</label><textarea id="j-desc" rows="4" placeholder="Describe the role, responsibilities, and what makes it exciting…"></textarea></div>
      <div class="field"><label>Requirements</label><textarea id="j-reqs" rows="3" placeholder="Required experience, skills, and qualifications…"></textarea></div>
      <div class="field-row3">
        <div class="field"><label>Min Salary</label><input type="number" id="j-sal-min" placeholder="150000"></div>
        <div class="field"><label>Max Salary</label><input type="number" id="j-sal-max" placeholder="300000"></div>
        <div class="field"><label>Currency</label>
          <select id="j-currency">
            <option value="NGN">NGN</option>
            <option value="USD">USD</option>
            <option value="KES">KES</option>
            <option value="GHS">GHS</option>
            <option value="ZAR">ZAR</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Screening Questions <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--mu2);font-size:10px">(optional)</span></label>
        <div class="sq-list" id="sq-list"></div>
        <button class="add-sq" onclick="addQuestion()">+ Add question</button>
      </div>
      <div class="modal-foot">
        <button class="btn btn-sec" onclick="closeModal()">Cancel</button>
        <button class="btn btn-pri" id="save-btn" onclick="saveJob()">
          <span id="save-label">Post Job</span>
          <span id="save-spin" class="spin-sm" style="display:none"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SB = supabase.createClient(
  'https://fdkvbszbgjhkvybawxrf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZka3Zic3piZ2poa3Z5YmF3eHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDM1NDUsImV4cCI6MjA4OTcxOTU0NX0.lc3QW3urgxJw1ucjkR4Buxw8OI034SI6vE1UoxOgYqM'
);

let WS = null, allJobs = [], currentFilter = 'all';

async function init() {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { window.location.href = 'peoplexats_auth.html'; return; }

  const { data: member } = await SB.from('team_members').select('*,workspaces(*)').eq('user_id', session.user.id).eq('status','active').single();
  if (!member) { window.location.href = 'peoplexats_onboarding.html'; return; }

  WS = member.workspaces;
  document.getElementById('ws-name').textContent = WS.name;
  document.getElementById('ws-role').textContent = member.role;
  const name = member.full_name || session.user.email;
  document.getElementById('sb-uname').textContent = name;
  document.getElementById('sb-uemail').textContent = member.email || session.user.email;
  document.getElementById('sb-avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('careers-link').href = `peoplexats_careers.html?workspace=${WS.careers_slug}`;

  // Pre-fill currency from workspace
  document.getElementById('j-currency').value = WS.preferred_currency || 'NGN';

  await loadJobs();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = 'flex';
}

async function loadJobs() {
  const { data } = await SB.from('jobs').select('*').eq('workspace_id', WS.id).order('created_at',{ascending:false});
  allJobs = data || [];
  document.getElementById('badge-jobs').textContent = allJobs.filter(j=>j.status==='open').length;
  renderJobs();
}

function renderJobs() {
  const search = document.getElementById('search-input').value.toLowerCase();
  let jobs = allJobs;
  if (currentFilter !== 'all') jobs = jobs.filter(j => j.status === currentFilter);
  if (search) jobs = jobs.filter(j => j.title.toLowerCase().includes(search) || (j.department||'').toLowerCase().includes(search) || (j.location||'').toLowerCase().includes(search));

  document.getElementById('job-count-label').textContent = `${jobs.length} job${jobs.length!==1?'s':''}`;

  const grid = document.getElementById('jobs-grid');
  const empty = document.getElementById('empty-state');

  if (jobs.length === 0) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';

  const fmtSalary = (j) => {
    if (!j.salary_min && !j.salary_max) return null;
    const fmt = (n) => n >= 1000000 ? `${(n/1000000).toFixed(1)}M` : n >= 1000 ? `${(n/1000).toFixed(0)}k` : n;
    const cur = j.currency || 'NGN';
    if (j.salary_min && j.salary_max) return `${cur} ${fmt(j.salary_min)} – ${fmt(j.salary_max)}`;
    if (j.salary_min) return `${cur} ${fmt(j.salary_min)}+`;
    return `Up to ${cur} ${fmt(j.salary_max)}`;
  };

  const ago = (ts) => {
    const d = Math.floor((Date.now()-new Date(ts))/86400000);
    return d===0?'Today':d===1?'Yesterday':`${d}d ago`;
  };

  grid.innerHTML = jobs.map(j => {
    const sal = fmtSalary(j);
    const typeLabel = {full_time:'Full-time',part_time:'Part-time',contract:'Contract',remote:'Remote',hybrid:'Hybrid'}[j.job_type]||j.job_type||'';
    return `
    <div class="job-card" onclick="openPipeline('${j.id}')">
      <div class="job-card-head">
        <div class="job-card-title">${escHtml(j.title)}</div>
        <div class="job-card-menu" onclick="event.stopPropagation()">
          <button class="menu-btn" onclick="toggleMenu('m-${j.id}')">⋯</button>
          <div class="dropdown" id="m-${j.id}">
            <button class="dd-item" onclick="editJob('${j.id}')">✏️ Edit job</button>
            <button class="dd-item" onclick="copyLink('${j.id}')">🔗 Copy application link</button>
            <div class="dd-sep"></div>
            ${j.status==='open'?`<button class="dd-item" onclick="setStatus('${j.id}','paused')">⏸ Pause</button><button class="dd-item" onclick="setStatus('${j.id}','closed')">🔒 Close</button>`:
              j.status==='draft'?`<button class="dd-item" onclick="setStatus('${j.id}','open')">🟢 Publish</button>`:
              j.status==='paused'?`<button class="dd-item" onclick="setStatus('${j.id}','open')">▶️ Reopen</button><button class="dd-item" onclick="setStatus('${j.id}','closed')">🔒 Close</button>`:
              `<button class="dd-item" onclick="setStatus('${j.id}','open')">♻️ Reopen</button>`}
            <div class="dd-sep"></div>
            <button class="dd-item danger" onclick="deleteJob('${j.id}','${escHtml(j.title)}')">🗑 Delete</button>
          </div>
        </div>
      </div>
      <div class="job-card-meta">
        ${j.department?`<span class="meta-tag">🏢 ${escHtml(j.department)}</span>`:''}
        ${j.location?`<span class="meta-tag">📍 ${escHtml(j.location)}</span>`:''}
        ${typeLabel?`<span class="meta-tag">⏰ ${typeLabel}</span>`:''}
        ${sal?`<span class="meta-tag">💰 ${sal}</span>`:''}
      </div>
      <div class="job-card-stats">
        <div class="stat-box"><div class="stat-box-n">${j.applicant_count||0}</div><div class="stat-box-l">Applicants</div></div>
      </div>
      <div class="job-card-foot">
        <span class="status-badge ${j.status}">${j.status}</span>
        <span class="job-age">${ago(j.created_at)}</span>
      </div>
    </div>`;
  }).join('');
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderJobs();
}

function searchJobs(v) { renderJobs(); }

function openPipeline(jobId) {
  window.location.href = `peoplexats_pipeline.html?job=${jobId}`;
}

function toggleMenu(id) {
  document.querySelectorAll('.dropdown').forEach(d=>{ if(d.id!==id) d.classList.remove('open'); });
  document.getElementById(id).classList.toggle('open');
}
document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('open')));

function copyLink(jobId) {
  const url = `${location.origin}/peoplexats_careers.html?workspace=${WS.careers_slug}&job=${jobId}`;
  navigator.clipboard.writeText(url).then(()=>toast('Application link copied!','ok')).catch(()=>toast('Could not copy link','er'));
}

async function setStatus(jobId, status) {
  const payload = { status };
  if (status === 'open') payload.published_at = new Date().toISOString();
  const { error } = await SB.from('jobs').update(payload).eq('id',jobId).eq('workspace_id',WS.id);
  if (error) { toast(error.message,'er'); return; }
  toast(`Job ${status==='open'?'published':status}!`,'ok');
  await loadJobs();
}

async function deleteJob(jobId, title) {
  if (!confirm(`Delete "${title}"? This cannot be undone.`)) return;
  const { error } = await SB.from('jobs').delete().eq('id',jobId).eq('workspace_id',WS.id);
  if (error) { toast(error.message,'er'); return; }
  toast('Job deleted','ok');
  await loadJobs();
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(job=null) {
  document.getElementById('edit-id').value = job?.id || '';
  document.getElementById('modal-title').textContent = job ? 'Edit Job' : 'Post a New Job';
  document.getElementById('save-label').textContent = job ? 'Save Changes' : 'Post Job';
  document.getElementById('j-title').value = job?.title || '';
  document.getElementById('j-dept').value = job?.department || '';
  document.getElementById('j-loc').value = job?.location || '';
  document.getElementById('j-type').value = job?.job_type || 'full_time';
  document.getElementById('j-status').value = job?.status || 'open';
  document.getElementById('j-desc').value = job?.description || '';
  document.getElementById('j-reqs').value = job?.requirements || '';
  document.getElementById('j-sal-min').value = job?.salary_min || '';
  document.getElementById('j-sal-max').value = job?.salary_max || '';
  document.getElementById('j-currency').value = job?.currency || WS.preferred_currency || 'NGN';
  // Screening questions
  const sqList = document.getElementById('sq-list');
  sqList.innerHTML = '';
  const qs = job?.screening_questions || [];
  qs.forEach(q => addQuestion(q));
  document.getElementById('job-modal').style.display = 'flex';
}

function closeModal() { document.getElementById('job-modal').style.display = 'none'; }

async function editJob(id) {
  const job = allJobs.find(j=>j.id===id);
  if (job) openModal(job);
}

function addQuestion(val='') {
  const div = document.createElement('div');
  div.className = 'sq-item';
  div.innerHTML = `<input type="text" placeholder="e.g. How many years of React experience do you have?" value="${escHtml(String(val))}">
    <button class="sq-rem" onclick="this.parentElement.remove()" title="Remove">✕</button>`;
  document.getElementById('sq-list').appendChild(div);
  div.querySelector('input').focus();
}

async function saveJob() {
  const title = document.getElementById('j-title').value.trim();
  if (!title) { toast('Job title is required','er'); return; }

  const btn = document.getElementById('save-btn');
  const lbl = document.getElementById('save-label');
  const spin = document.getElementById('save-spin');
  btn.disabled=true; lbl.style.display='none'; spin.style.display='inline-block';

  const questions = Array.from(document.querySelectorAll('#sq-list input')).map(i=>i.value.trim()).filter(Boolean);
  const status = document.getElementById('j-status').value;
  const payload = {
    workspace_id: WS.id,
    title,
    department: document.getElementById('j-dept').value.trim()||null,
    location: document.getElementById('j-loc').value.trim()||null,
    job_type: document.getElementById('j-type').value,
    description: document.getElementById('j-desc').value.trim()||null,
    requirements: document.getElementById('j-reqs').value.trim()||null,
    salary_min: document.getElementById('j-sal-min').value||null,
    salary_max: document.getElementById('j-sal-max').value||null,
    currency: document.getElementById('j-currency').value,
    status,
    screening_questions: questions,
    published_at: status==='open' ? new Date().toISOString() : null,
  };

  const editId = document.getElementById('edit-id').value;
  const { error } = editId
    ? await SB.from('jobs').update(payload).eq('id',editId).eq('workspace_id',WS.id)
    : await SB.from('jobs').insert(payload);

  btn.disabled=false; lbl.style.display='inline'; spin.style.display='none';
  if (error) { toast(error.message,'er'); return; }
  toast(editId ? 'Job updated!' : 'Job posted! 🎉', 'ok');
  closeModal();
  await loadJobs();
}

async function signOut() { await SB.auth.signOut(); window.location.href = 'peoplexats_auth.html'; }

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.innerHTML = `<span>${type==='ok'?'✓':'✕'}</span>${escHtml(msg)}`;
  document.getElementById('toast').appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

init();
</script>
</body>
</html>

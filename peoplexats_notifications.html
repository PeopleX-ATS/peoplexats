<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PeopleX ATS — Notifications</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --o:#fe572a;--od:rgba(254,87,42,0.12);--og:rgba(254,87,42,0.3);
  --g:#8cc74f;--gd:rgba(140,199,79,0.1);
  --ink:#080706;--ink2:#111009;--ink3:#1a1814;
  --w:#fff;--mu:rgba(255,255,255,0.42);--mu2:rgba(255,255,255,0.18);
  --bd:rgba(255,255,255,0.06);--bd2:rgba(255,255,255,0.1);
  --err:#f87171;--errd:rgba(248,113,113,0.1);
  --f:system-ui,-apple-system,sans-serif;
  --ez:cubic-bezier(0.16,1,0.3,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--ink);color:var(--w);-webkit-font-smoothing:antialiased;display:flex}
#loading{position:fixed;inset:0;z-index:999;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.big-spin{width:36px;height:36px;border:3px solid rgba(254,87,42,.3);border-top-color:var(--o);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:13px;color:var(--mu)}
#sidebar{width:220px;flex-shrink:0;background:var(--ink2);border-right:1px solid var(--bd);display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.sb-logo{padding:20px 18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;text-decoration:none}
.sb-ws{padding:12px 14px;margin:10px 10px 4px;background:var(--ink3);border-radius:8px;border:1px solid var(--bd2)}
.sb-ws-name{font-size:12px;font-weight:700;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-ws-role{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.sb-section{padding:6px 10px 2px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mu2)}
.sb-nav{padding:4px 10px;display:flex;flex-direction:column;gap:2px}
.sb-link{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--mu);text-decoration:none;transition:all .15s;position:relative}
.sb-link:hover{background:var(--ink3);color:var(--w)}
.sb-link.active{background:var(--od);color:var(--o);font-weight:600}
.sb-link.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:16px;background:var(--o);border-radius:0 2px 2px 0}
.sb-link svg{width:15px;height:15px;flex-shrink:0;opacity:.7}
.sb-link.active svg{opacity:1}
.sb-badge{margin-left:auto;background:var(--o);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;line-height:1.5}
.sb-bottom{margin-top:auto;padding:12px 10px;border-top:1px solid var(--bd)}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s}
.sb-user:hover{background:var(--ink3)}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:var(--od);border:1px solid rgba(254,87,42,.3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--o);flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-uemail{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:56px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 28px;flex-shrink:0}
.tb-title{font-size:15px;font-weight:700;color:var(--w)}
.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{font-family:var(--f);font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;padding:7px 14px;transition:all .15s}
.tb-btn-sec{background:var(--ink3);color:var(--mu);border:1px solid var(--bd2)}
.tb-btn-sec:hover{color:var(--w);border-color:rgba(255,255,255,.2)}
.tb-btn-pri{background:var(--od);color:var(--o);border:1px solid rgba(254,87,42,.3)}
.tb-btn-pri:hover{background:rgba(254,87,42,.2)}
.filter-bar{padding:10px 28px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.filter-tab{font-family:var(--f);font-size:12px;font-weight:600;background:none;border:1px solid var(--bd2);border-radius:6px;color:var(--mu);padding:5px 14px;cursor:pointer;transition:all .15s}
.filter-tab:hover{color:var(--w)}
.filter-tab.active{background:var(--od);border-color:rgba(254,87,42,.3);color:var(--o)}
.filter-count{margin-left:auto;font-size:12px;color:var(--mu)}
#content{flex:1;overflow-y:auto}
.notif-item{display:flex;align-items:flex-start;gap:14px;padding:14px 28px;border-bottom:1px solid var(--bd);transition:background .12s;cursor:default;position:relative}
.notif-item.unread{background:rgba(254,87,42,.03)}
.notif-item.unread::before{content:'';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:6px;height:6px;background:var(--o);border-radius:50%}
.notif-ico{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.notif-ico.application{background:rgba(140,199,79,.1);border:1px solid rgba(140,199,79,.2)}
.notif-ico.interview{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2)}
.notif-ico.hire{background:rgba(254,87,42,.12);border:1px solid rgba(254,87,42,.2)}
.notif-ico.stage{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2)}
.notif-ico.system{background:rgba(255,255,255,.06);border:1px solid var(--bd2)}
.notif-body{flex:1;min-width:0}
.notif-title{font-size:13px;font-weight:600;color:var(--w);margin-bottom:3px;line-height:1.4}
.notif-desc{font-size:12px;color:var(--mu);line-height:1.5}
.notif-time{font-size:11px;color:var(--mu2);flex-shrink:0;white-space:nowrap;margin-top:2px}
.notif-channel{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;margin-top:5px}
.notif-channel.whatsapp{color:#25d366;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.2)}
.notif-channel.email{color:#60a5fa;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.2)}
.notif-channel.system{color:var(--mu2);background:rgba(255,255,255,.04);border:1px solid var(--bd)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal{background:var(--ink2);border:1px solid var(--bd2);border-radius:16px;width:100%;max-width:520px;animation:slideUp .3s var(--ez);margin:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-head{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:700;color:var(--w)}
.modal-close{background:none;border:none;color:var(--mu);cursor:pointer;font-size:18px;padding:4px;border-radius:4px;line-height:1}
.modal-close:hover{color:var(--w)}
.modal-body{padding:18px 24px 24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--ink3);border:1.5px solid var(--bd2);color:var(--w);font-family:var(--f);font-size:13px;padding:9px 12px;border-radius:8px;outline:none;transition:border-color .2s,box-shadow .2s}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.2)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--o);box-shadow:0 0 0 3px var(--od)}
.field select option{background:var(--ink3)}
.field textarea{resize:vertical;min-height:100px;line-height:1.6}
.channel-note{font-size:11px;color:var(--mu2);margin-top:5px;line-height:1.5}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--bd)}
.btn{font-family:var(--f);font-size:13px;font-weight:600;border:none;border-radius:7px;padding:10px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn-sec{background:var(--ink3);color:var(--mu);border:1px solid var(--bd2)}
.btn-sec:hover{color:var(--w)}
.btn-pri{background:var(--o);color:#fff}
.btn-pri:hover{background:#ff6a40}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}
.spin-sm{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.empty-full{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;gap:12px;padding:40px}
.empty-full .ico{font-size:40px;opacity:.3}
.empty-full h3{font-size:18px;font-weight:700;color:var(--w)}
.empty-full p{font-size:14px;color:var(--mu);max-width:320px;line-height:1.7}
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast-item{background:var(--ink2);border:1px solid var(--bd2);border-radius:9px;padding:12px 16px;font-size:13px;color:var(--w);box-shadow:0 8px 32px rgba(0,0,0,.5);animation:slideUp .3s var(--ez);display:flex;align-items:center;gap:8px;max-width:320px}
.toast-item.ok{border-left:3px solid var(--g)}
.toast-item.er{border-left:3px solid var(--err)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
@media(max-width:900px){
  #sidebar{width:60px}
  .sb-logo svg:last-child,.sb-ws,.sb-section,.sb-link span,.sb-badge,.sb-uname,.sb-uemail{display:none}
  .sb-link{justify-content:center;padding:10px}
  .sb-logo{justify-content:center;padding:16px}
  .sb-nav{padding:4px 6px}
  .sb-bottom{padding:8px 6px}
  .sb-user{justify-content:center}
  .notif-item{padding:12px 16px}
  .notif-item.unread::before{left:6px}
}
</style>
</head>

<div class="modal-overlay" id="send-modal" style="display:none" onclick="if(event.target===this)closeSendModal()">

    <div class="modal-head"><h3>Send Notification to Candidate</h3><button class="modal-close" onclick="closeSendModal()">✕</button></div>

<script>
const SUPABASE_URL='https://fdkvbszbgjhkvybawxrf.supabase.co';
const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZka3Zic3piZ2poa3Z5YmF3eHJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxNDM1NDUsImV4cCI6MjA4OTcxOTU0NX0.lc3QW3urgxJw1ucjkR4Buxw8OI034SI6vE1UoxOgYqM';
const SB=supabase.createClient(SUPABASE_URL,ANON_KEY);
let WS=null,MEMBER=null,allNotifs=[],allCandidates=[],currentFilter='all';
let readIds=new Set(JSON.parse(localStorage.getItem('px_read')||'[]'));

// Action → icon/class mapping (uses `action` column, not event_type)
const ACTION_MAP={
  'new_application':{ico:'🟢',cls:'application'},
  'stage_change':{ico:'🔄',cls:'stage'},
  'interview_scheduled':{ico:'📅',cls:'interview'},
  'interview_completed':{ico:'✅',cls:'interview'},
  'hired':{ico:'🎉',cls:'hire'},
  'fee_due':{ico:'💰',cls:'hire'},
};

async function init(){
  const{data:{session}}=await SB.auth.getSession();
  if(!session){window.location.href='peoplexats_auth.html';return;}
  const{data:member}=await SB.from('team_members').select('*,workspaces(*)').eq('user_id',session.user.id).eq('status','active').single();
  if(!member){window.location.href='peoplexats_onboarding.html';return;}
  MEMBER=member;WS=member.workspaces;
  document.getElementById('ws-name').textContent=WS.name;
  document.getElementById('ws-role').textContent=member.role;
  const name=member.full_name||session.user.email;
  document.getElementById('sb-uname').textContent=name;
  document.getElementById('sb-uemail').textContent=member.email||session.user.email;
  document.getElementById('sb-avatar').textContent=name.charAt(0).toUpperCase();
  await loadAll();
  document.getElementById('loading').style.display='none';
  document.getElementById('main').style.display='flex';
}

async function loadAll(){
  const[logRes,candsRes,nlogRes]=await Promise.all([
    // activity_log uses `action` column (not event_type)
    SB.from('activity_log').select('id,action,meta,candidate_id,created_at,candidates(full_name),jobs:meta->job_id(title)').eq('workspace_id',WS.id).order('created_at',{ascending:false}).limit(80),
    SB.from('candidates').select('id,full_name,email,phone,job_id').eq('workspace_id',WS.id).order('full_name'),
    // notifications_log uses `message` column (correct)
    SB.from('notifications_log').select('id,template,message,channel,status,sent_at,candidate_id,candidates(full_name)').eq('workspace_id',WS.id).order('sent_at',{ascending:false}).limit(50),
  ]);

  allCandidates=candsRes.data||[];
  const cs=document.getElementById('sn-candidate');
  cs.innerHTML='<option value="">Select candidate…</option>'+allCandidates.map(c=>`
    <option value="${c.id}" data-email="${esc(c.email||'')}" data-phone="${esc(c.phone||'')}" data-name="${esc(c.full_name)}">
      ${esc(c.full_name)}${c.phone?' · '+c.phone:c.email?' · '+c.email:''}
    </option>`).join('');

  // Build unified feed
  const actItems=(logRes.data||[]).map(a=>{
    const info=ACTION_MAP[a.action]||{ico:'⚙️',cls:'system'};
    const cname=a.candidates?.full_name||'';
    const meta=a.meta||{};
    let title='',desc='';
    switch(a.action){
      case'new_application':title=`${cname} applied`;desc=`Source: ${meta.source||'careers page'}`;break;
      case'stage_change':title=`${cname} moved to ${meta.to_stage||'new stage'}`;desc=`From ${meta.from_stage||'—'}`;break;
      case'interview_scheduled':title=`Interview scheduled with ${cname}`;desc=meta.channel||'';break;
      case'interview_completed':title=`Interview with ${cname} completed`;desc='';break;
      case'hired':title=`${cname} was hired`;desc=meta.salary?`${meta.currency||'NGN'} ${Number(meta.salary).toLocaleString()}`:'';break;
      default:title=a.action||'Activity';desc=meta.description||JSON.stringify(meta).slice(0,80);
    }
    return{id:'act_'+a.id,type:a.action,title,desc,channel:null,ico:info.ico,cls:info.cls,ts:a.created_at};
  });

  const nlogItems=(nlogRes.data||[]).map(n=>({
    id:'nlog_'+n.id,
    type:'sent',
    title:`Notification sent to ${n.candidates?.full_name||'candidate'}`,
    desc:(n.message||'').slice(0,100)+((n.message||'').length>100?'…':''),
    channel:n.channel||'email',
    ico:n.channel==='whatsapp'?'💬':'📧',
    cls:'system',
    ts:n.sent_at||new Date().toISOString(),
    status:n.status,
  }));

  allNotifs=[...actItems,...nlogItems].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  const unread=allNotifs.filter(n=>!readIds.has(n.id)).length;
  document.getElementById('badge-n').textContent=unread||'';
  render();
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  let items=allNotifs;
  if(currentFilter==='application')items=items.filter(n=>n.type==='new_application');
  else if(currentFilter==='interview')items=items.filter(n=>n.type==='interview_scheduled'||n.type==='interview_completed');
  else if(currentFilter==='hire')items=items.filter(n=>n.type==='hired'||n.type==='fee_due');
  else if(currentFilter==='sent')items=items.filter(n=>n.type==='sent');
  document.getElementById('filter-count').textContent=`${items.length} notification${items.length!==1?'s':''}`;
  const el=document.getElementById('notif-list');
  if(!items.length){
    el.innerHTML=`<div class="empty-full"><div class="ico">🔔</div><h3>No notifications</h3><p>${currentFilter==='all'?'Activity and sent notifications will appear here.':'Nothing in this category yet.'}</p></div>`;
    return;
  }
  const ago=ts=>{
    const d=Math.floor((Date.now()-new Date(ts))/1000);
    if(d<60)return'Just now';if(d<3600)return`${Math.floor(d/60)}m ago`;
    if(d<86400)return`${Math.floor(d/3600)}h ago`;
    if(d<604800)return`${Math.floor(d/86400)}d ago`;
    return new Date(ts).toLocaleDateString('en-NG',{month:'short',day:'numeric'});
  };
  el.innerHTML=items.map(n=>{
    const isUnread=!readIds.has(n.id);
    const chHtml=n.channel?`<span class="notif-channel ${n.channel}">${n.channel==='whatsapp'?'💬 WhatsApp':n.channel==='email'?'📧 Email':'⚙️ System'}</span>`:'';
    const statusHtml=n.status&&n.status!=='sent'?`<span style="font-size:10px;color:var(--mu2);margin-left:6px">(${n.status})</span>`:'';
    return`<div class="notif-item ${isUnread?'unread':''}" onclick="markRead('${n.id}')">
      <div class="notif-ico ${n.cls}">${n.ico}</div>
      <div class="notif-body">
        <div class="notif-title">${esc(n.title)}${statusHtml}</div>
        <div class="notif-desc">${esc(n.desc||'')}</div>
        ${chHtml}
      </div>
      <div class="notif-time">${ago(n.ts)}</div>
    </div>`;
  }).join('');
}

function markRead(id){
  readIds.add(id);
  localStorage.setItem('px_read',JSON.stringify([...readIds]));
  document.querySelectorAll(`.notif-item`).forEach(el=>{
    if(el.getAttribute('onclick')===`markRead('${id}')`)el.classList.remove('unread');
  });
  const unread=allNotifs.filter(n=>!readIds.has(n.id)).length;
  document.getElementById('badge-n').textContent=unread||'';
}
function markAllRead(){
  allNotifs.forEach(n=>readIds.add(n.id));
  localStorage.setItem('px_read',JSON.stringify([...readIds]));
  document.querySelectorAll('.notif-item.unread').forEach(el=>el.classList.remove('unread'));
  document.getElementById('badge-n').textContent='';
  toast('All marked as read','ok');
}

// SEND MODAL
function openSendModal(){document.getElementById('send-modal').style.display='flex';}
function closeSendModal(){document.getElementById('send-modal').style.display='none';}

function onChannelChange(){
  const ch=document.getElementById('sn-channel').value;
  const note=document.getElementById('channel-note');
  note.textContent=ch==='whatsapp'
    ?'Will be sent via notify-candidate Edge Function. Candidate phone number required.'
    :'Will be sent via send-email Edge Function using SendGrid. Candidate email required.';
}
function onCandidateChange(){
  // Re-apply template to update name placeholder
  const key=document.getElementById('sn-template').value;
  if(key)applyTemplate();
}

const TEMPLATES={
  application_received:`Hi {{name}},\n\nThank you for applying to {{job}} at {{company}}. We've received your application and our AI is reviewing your CV now. We'll be in touch shortly.\n\nBest regards,\n{{company}} Team`,
  shortlisted:`Hi {{name}},\n\nGreat news! You've been shortlisted for the {{job}} role at {{company}}. We'd love to move forward with your application and will be in touch to schedule the next steps.\n\nBest regards,\n{{company}} Team`,
  interview_scheduled:`Hi {{name}},\n\nWe'd like to invite you for an interview for the {{job}} position at {{company}}.\n\nWe'll send you the details shortly — please keep an eye on your email.\n\nBest regards,\n{{company}} Team`,
  offer_made:`Hi {{name}},\n\nCongratulations! We're pleased to offer you the {{job}} position at {{company}}. We'll be sending the formal offer letter shortly.\n\nWelcome to the team!\n\n{{company}} Team`,
  rejected:`Hi {{name}},\n\nThank you for your interest in the {{job}} role at {{company}} and the time you invested in our process.\n\nAfter careful consideration, we've decided to move forward with other candidates at this time. We'll keep your profile on file for future opportunities.\n\nBest regards,\n{{company}} Team`,
};

function applyTemplate(){
  const key=document.getElementById('sn-template').value;
  if(!key)return;
  const opt=document.getElementById('sn-candidate').selectedOptions[0];
  const candName=opt?.dataset?.name||'[Candidate Name]';
  let msg=TEMPLATES[key]||'';
  msg=msg.replace(/{{name}}/g,candName.split(' ')[0]);
  msg=msg.replace(/{{company}}/g,WS.name||'[Company]');
  msg=msg.replace(/{{job}}/g,'[Role]');
  document.getElementById('sn-message').value=msg;
}

async function sendNotification(){
  const candId=document.getElementById('sn-candidate').value;
  const msg=document.getElementById('sn-message').value.trim();
  const channel=document.getElementById('sn-channel').value;
  const template=document.getElementById('sn-template').value||'custom';
  if(!candId){toast('Please select a candidate','er');return;}
  if(!msg){toast('Message cannot be empty','er');return;}

  const opt=document.getElementById('sn-candidate').selectedOptions[0];
  const email=opt?.dataset?.email||'';
  const phone=opt?.dataset?.phone||'';
  const candName=opt?.dataset?.name||'';

  if(channel==='email'&&!email){toast('This candidate has no email address on file','er');return;}
  if(channel==='whatsapp'&&!phone){toast('This candidate has no phone number on file','er');return;}

  const btn=document.getElementById('send-btn');
  const lbl=document.getElementById('send-label');
  const spin=document.getElementById('send-spin');
  btn.disabled=true;lbl.style.display='none';spin.style.display='inline-block';

  try{
    if(channel==='email'){
      // Call send-email edge function
      const res=await fetch(`${SUPABASE_URL}/functions/v1/send-email`,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON_KEY}`},
        body:JSON.stringify({
          template:'custom_message',
          to:email,
          data:{
            candidate_id:candId,
            workspace_id:WS.id,
            candidate_name:candName,
            company:WS.name,
            message_body:msg,
          }
        })
      });
      // If template not found, fall through to just log it
      // (send-email may not have a custom_message template — log manually)
      if(!res.ok){
        // Log directly since edge function may not support custom template
        await logNotification(candId,template,msg,channel,'pending');
        toast(`Logged for sending — configure SendGrid to deliver emails`,'ok');
      } else {
        toast(`Email sent to ${email}`,'ok');
      }
    } else {
      // Call notify-candidate edge function for WhatsApp
      const res=await fetch(`${SUPABASE_URL}/functions/v1/notify-candidate`,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${ANON_KEY}`},
        body:JSON.stringify({candidate_id:candId,template,custom_message:msg})
      });
      const data=await res.json();
      if(!res.ok)throw new Error(data.error||'WhatsApp send failed');
      toast(`WhatsApp notification ${data.status==='sent'?'sent':'logged (pending WA config)'}`,'ok');
    }
  }catch(err){
    // Fallback: just log it
    await logNotification(candId,template,msg,channel,'pending');
    toast(`Logged — ${err.message}`,'ok');
  }

  btn.disabled=false;lbl.style.display='inline';spin.style.display='none';
  closeSendModal();
  document.getElementById('sn-candidate').value='';
  document.getElementById('sn-message').value='';
  document.getElementById('sn-template').value='';
  await loadAll();
}

async function logNotification(candidateId,template,message,channel,status){
  await SB.from('notifications_log').insert({
    candidate_id:candidateId,
    workspace_id:WS.id,
    template,
    message, // correct column name
    channel,
    status,
    sent_at:new Date().toISOString(),
    sent_by:MEMBER.id,
  });
}

async function signOut(){await SB.auth.signOut();window.location.href='peoplexats_auth.html';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,type='ok'){const el=document.createElement('div');el.className=`toast-item ${type}`;el.innerHTML=`<span>${type==='ok'?'✓':'✕'}</span>${esc(msg)}`;document.getElementById('toast').appendChild(el);setTimeout(()=>el.remove(),4000);}
init();
</script>
